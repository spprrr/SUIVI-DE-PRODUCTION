<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
/* ===== Résumé v20 : état déduit automatiquement des moules/cycles ===== */
function resumeMachineStatus(machine){
  const cfg = (typeof config !== 'undefined' && config && config.machines) ? config.machines[machine.id] || {} : {};
  const moulds = [];
  if (cfg.mouleId || cfg.moule || cfg.moule1) moulds.push(cfg.mouleId || cfg.moule || cfg.moule1);
  if (cfg.mouleId2 || cfg.moule2) moulds.push(cfg.mouleId2 || cfg.moule2);

  const unique = [...new Set(moulds.filter(Boolean).map(String))];
  const cycles = [];
  if (cfg.cycle !== undefined && cfg.cycle !== null && String(cfg.cycle).trim() !== '') cycles.push(cfg.cycle);
  if (cfg.cycle2 !== undefined && cfg.cycle2 !== null && String(cfg.cycle2).trim() !== '') cycles.push(cfg.cycle2);

  const noMould = unique.length === 0;
  const noCycle = !noMould && cycles.length < unique.length;

  return { moulds: unique, noMould, noCycle };
}

function renderResumeMachineLine(machine){
  const s = resumeMachineStatus(machine);
  const dot = s.noMould
    ? '<span title="Aucun moule" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;margin-right:5px;vertical-align:middle"></span>'
    : (s.noCycle
      ? '<span title="Cycle manquant" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#f59e0b;margin-right:5px;vertical-align:middle"></span>'
      : '');

  const mouldText = s.moulds.length
    ? s.moulds.map((id, i) =>
        `<span style="display:inline-block;margin-left:${i ? 10 : 0}px;padding:3px 8px;border:1px solid #ddd;border-radius:8px">${escapeHtml(String(id))}</span>`
      ).join('')
    : '<span style="color:#777">Aucun moule</span>';

  return `<div class="resume-machine-line" style="display:flex;align-items:center;gap:4px;padding:7px 4px;border-bottom:1px solid #eee">
    <span style="min-width:95px;font-weight:700;white-space:nowrap">${dot}${escapeHtml(String(machine.numero || machine.num || machine.id))}</span>
    <span style="display:flex;align-items:center;flex-wrap:wrap">${mouldText}</span>
  </div>`;
}

function renderResumeMachinesV20(){
  const list = (typeof REAL_MACHINES !== 'undefined' && Array.isArray(REAL_MACHINES))
    ? REAL_MACHINES
    : ((typeof refs !== 'undefined' && refs.machines) ? refs.machines : []);
  const ordered = [...list].sort((a,b) => {
    const aa = Number(a.atelier || 0), bb = Number(b.atelier || 0);
    if (aa !== bb) return aa - bb;
    const ia = (typeof MACHINES_PAR_ATELIER !== 'undefined' && MACHINES_PAR_ATELIER[aa])
      ? MACHINES_PAR_ATELIER[aa].indexOf(String(a.numero || a.num)) : 9999;
    const ib = (typeof MACHINES_PAR_ATELIER !== 'undefined' && MACHINES_PAR_ATELIER[bb])
      ? MACHINES_PAR_ATELIER[bb].indexOf(String(b.numero || b.num)) : 9999;
    return ia - ib;
  });
  let html = '';
  let current = null;
  for (const m of ordered){
    if (m.atelier !== current){
      current = m.atelier;
      html += `<h3 style="margin:16px 0 6px">Atelier ${current}</h3>`;
    }
    html += renderResumeMachineLine(m);
  }
  return html || '<p>Aucune machine.</p>';
}

</script>
<script>
const CONFIG_KEY = 'injApp_config';
const DAYS_KEY = 'injApp_days';
const REFS_KEY = 'injApp_refs';
const ATELIERS_COUNT = 4;
const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];

function pad(n){ return n.toString().padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function formatDateShort(dateStr){
  const [y,m,d] = dateStr.split('-');
  return d + '.' + m + '.' + y;
}
function formatDateSwiss(dateStr){
  const [y,m,d] = dateStr.split('-');
  const jour = JOURS[new Date(dateStr+'T00:00:00').getDay()];
  return jour + ' ' + d + '.' + m + '.' + y;
}
function generateId(prefix){
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
}

const SYNC_MODE = 'local';
const DataStore = {
  getConfig(){ if(SYNC_MODE === 'local') return JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); },
  saveConfig(c){ if(SYNC_MODE === 'local') localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); },
  getDays(){ if(SYNC_MODE === 'local') return JSON.parse(localStorage.getItem(DAYS_KEY) || '{}'); },
  saveDays(d){ if(SYNC_MODE === 'local') localStorage.setItem(DAYS_KEY, JSON.stringify(d)); },
  getRefs(){ if(SYNC_MODE === 'local') return JSON.parse(localStorage.getItem(REFS_KEY) || 'null'); },
  saveRefs(r){ if(SYNC_MODE === 'local') localStorage.setItem(REFS_KEY, JSON.stringify(r)); }
};

let refs = DataStore.getRefs();
if(!refs){
  refs = {
    operateurs: ['Ahmed', 'Mohamed', 'Karim', 'Samir', 'Youssef'],
    moules: [
      {id:generateId('m'), numero:'M001', nom:'Moule A', piecesParMoule:8, machineIds:[]},
      {id:generateId('m'), numero:'M002', nom:'Moule B', piecesParMoule:6, machineIds:[]},
      {id:generateId('m'), numero:'M003', nom:'Moule C', piecesParMoule:4, machineIds:[]}
    ],
    machines: [],

let config = DataStore.getConfig() || {};
let days = DataStore.getDays() || {};

// Liste réelle des machines par atelier.
const MACHINES_PAR_ATELIER = {
  1: ['14301','14302','14246','14239','14205','14206','14240','14408','14409','14410','14311','14312','14313','14314'],
  2: ['14415','14116','14117','14118','14119','14120','14121','14122','14123','14124','14125','14126','14127','14128','14129','14130','14131','14548'],
  3: ['14233','14141','14135','14136','14137','14138','14303','14304','14002','14001'],
  4: ['14544','14145','14143','14134','14242','14207','14147','14132','14250','14549']
};
const REAL_MACHINES = Object.entries(MACHINES_PAR_ATELIER).flatMap(([atelier, nums]) =>
  nums.map(numero => ({ id:'A'+atelier+'-'+numero, atelier:Number(atelier), numero, mouleId:null }))
);

// Structure initiale des machines. Elle sert uniquement à initialiser la base.
// Ensuite, la liste des machines est indépendante des moules et peut être modifiée.
(function initMachineReference(){
  const VERSION = 2;
  const oldMachines = Array.isArray(refs.machines) ? refs.machines : [];
  if(refs.machineStructureVersion === VERSION && oldMachines.length){
    refs.machines = oldMachines;
    return;
  }
  const oldByNumero = {};
  oldMachines.forEach(m => { if(m && m.numero) oldByNumero[String(m.numero)] = m; });
  const oldByPosition = {};
  oldMachines.forEach(m => {
    const a=String(m.atelier||'');
    if(!oldByPosition[a]) oldByPosition[a]=[];
    oldByPosition[a].push(m);
  });
  const newMachines = [];
  Object.entries(MACHINES_PAR_ATELIER).forEach(([atelier, nums])=>{
    nums.forEach((numero,pos)=>{
      const old = oldByNumero[numero] || (oldByPosition[atelier]||[])[pos] || {};
      newMachines.push({
        id:'A'+atelier+'-'+numero,
        atelier:Number(atelier),
        numero,
        mouleId:null
      });
    });
  });
  refs.machines = newMachines;
  refs.machineStructureVersion = VERSION;

  // Les moules ne sont plus liés à une machine dans les données de référence.
  if(Array.isArray(refs.moules)) refs.moules.forEach(m=>{ delete m.machineIds; });

  // Reprendre les données de configuration selon le numéro de machine.
  const newConfig = {};
  newMachines.forEach(nm=>{
    const old = oldByNumero[nm.numero];
    const oldId = old && old.id;
    const source = (oldId && config[oldId]) || config[nm.id] || {};
    newConfig[nm.id] = {
      ...source,
      atelier:nm.atelier,
      num:nm.numero,
      mouleId: source.mouleId || null
    };
  });
  config = newConfig;

  // Reprendre les journées selon le numéro de machine, sans créer de lien moule permanent.
  const newDays = {};
  Object.keys(days||{}).forEach(date=>{
    const oldDay=days[date];
    const nd={...oldDay, machines:{}};
    newMachines.forEach(nm=>{
      const old = oldByNumero[nm.numero];
      const oldId = old && old.id;
      const src = (oldId && oldDay && oldDay.machines && oldDay.machines[oldId]) ||
                   (oldDay && oldDay.machines && oldDay.machines[nm.id]) || {};
      nd.machines[nm.id] = {...src};
    });
    newDays[date]=nd;
  });
  days = newDays;
  DataStore.saveRefs(refs);
  DataStore.saveConfig(config);
  DataStore.saveDays(days);
})();

// Compatibilité avec les anciennes données : créer la liste des matières et y récupérer les matières déjà utilisées.
if(!Array.isArray(refs.materiaux)) refs.materiaux = [];
Object.keys(DataStore.getConfig() || {}).forEach(id => {
  const v = (DataStore.getConfig() || {})[id]?.matiere;
  if(v && !refs.materiaux.includes(v)) refs.materiaux.push(v);
});
if(refs.materiaux.length===0) refs.materiaux.push('Matière standard');
refs.moules.forEach(m => { if(m.piecesReelles===undefined || m.piecesReelles===null) m.piecesReelles = m.piecesParMoule || ''; });
DataStore.saveRefs(refs);

refs.machines.forEach(m => {
  if(!config[m.id]){
    config[m.id] = {
      atelier: m.atelier,
      num: m.numero,
      mouleId: m.mouleId,
      operateur: '',
      cycle: '',
      matiere: '',
      reference: ''
    };
  }
});
DataStore.saveConfig(config);

// Ordre strict demandé : atelier 1 puis 2 puis 3 puis 4,
// et à l'intérieur de chaque atelier exactement l'ordre fourni.
let machineIds = REAL_MACHINES.map(m => m.id).filter(id => !!config[id]);

function saveConfig(){ DataStore.saveConfig(config); }
function saveRefs(){ DataStore.saveRefs(refs); }
function saveDays(){ DataStore.saveDays(days); }

function ensureToday(){
  const t = selectedDate || todayStr();
  if(!days[t]){
    days[t] = { date:t, shift:'', machines:{} };
    machineIds.forEach(id=>{
      const m = config[id];
      days[t].machines[id] = {
        mouleId: m.mouleId,
        moulesAvances: [],
        operateur: m.operateur,
        cycle: m.cycle,
        matiere: m.matiere,
        reference: m.reference,
        production:'', sacs:'', broye:'', rebuts:'',
        statut:'marche', arrets: []
      };
    });
    saveDays();
  }
  machineIds.forEach(id=>{
    const dm = days[t].machines[id];
    if(!dm) return;
    if(dm.rebuts === undefined) dm.rebuts = '';
    if(dm.moulesAvances === undefined) dm.moulesAvances = [];
    if(dm.mouleId === undefined) dm.mouleId = config[id].mouleId || null;
    if(dm.broye === undefined) dm.broye = '';
    if(dm.couleur === undefined) dm.couleur = config[id].couleur || '';
  });
  return days[t];
}

  const nom=document.getElementById('f_moule_nom'), theo=document.getElementById('f_moule_theorique'), reel=document.getElementById('f_moule_reel');

function saveCurrentStep(){
  const day = ensureToday(), id = machineIds[currentIndex], m = day.machines[id];
  if(currentTournee === 1){
    const typedMoule=document.getElementById('f_moule_num').value.trim();
    const foundMoule=refs.moules.find(x=>String(x.numero).toLowerCase()===typedMoule.toLowerCase());
    if(typedMoule && !foundMoule){ alert('Numéro de moule introuvable dans la base de données.'); return; }
    m.mouleId = foundMoule ? foundMoule.id : null;
    m.operateur = document.getElementById('f_operateur').value;
    m.cycle = document.getElementById('f_cycle').value;
    m.matiere = document.getElementById('f_matiere').value;
    m.couleur = document.getElementById('f_couleur').value;
    m.statut = document.getElementById('f_statut') ? document.getElementById('f_statut').value : (m.statut || 'marche');
    const realFoot=document.getElementById('f_moule_reel'); if(foundMoule && realFoot) foundMoule.piecesReelles=parseInt(realFoot.value)||0;
    m.piecesReelles = realFoot ? realFoot.value : '';
    config[id].mouleId = m.mouleId; config[id].operateur = m.operateur; config[id].cycle = m.cycle; config[id].matiere = m.matiere; config[id].couleur = m.couleur;
    saveConfig();
  } else {
    m.production = document.getElementById('f_production').value;
    m.sacs = document.getElementById('f_sacs').value;
    m.broye = document.getElementById('f_broye') ? document.getElementById('f_broye').value : '';
    m.rebuts = document.getElementById('f_rebuts').value;
    m.statut = document.getElementById('f_statut').value;

  }
  saveDays();
}

function renderResume(){
  const dateKey = document.getElementById('resumeDateSelect').value, day = days[dateKey], content = document.getElementById('resumeContent');
  if(!day){ content.innerHTML = '<p>Aucune donnée.</p>'; return; }

  const parAtelier = {}, ouvriersJour = new Set();
  let totalMachinesActives = 0;
  const orderedMachines = [...machineIds].sort((a,b)=>{
    const ca=config[a]||{}, cb=config[b]||{};
    if(Number(ca.atelier||0)!==Number(cb.atelier||0)) return Number(ca.atelier||0)-Number(cb.atelier||0);
    const na=String(ca.num||ca.numero||a), nb=String(cb.num||cb.numero||b);
    const la=(typeof MACHINES_PAR_ATELIER!=='undefined'&&MACHINES_PAR_ATELIER[ca.atelier]) ? MACHINES_PAR_ATELIER[ca.atelier].indexOf(na) : -1;
    const lb=(typeof MACHINES_PAR_ATELIER!=='undefined'&&MACHINES_PAR_ATELIER[cb.atelier]) ? MACHINES_PAR_ATELIER[cb.atelier].indexOf(nb) : -1;
    return (la<0?9999:la)-(lb<0?9999:lb);
  });

  function getMouldRows(m){
    const rows=[];
    const main=refs.moules.find(x=>x.id===m.mouleId);
    if(main) rows.push({moule:main, cycle:String(m.cycle||'').trim(), couleurId:m.couleur});
    (m.moulesAvances||[]).forEach(ma=>{
      const mo=refs.moules.find(x=>x.id===ma.mouleId);
      if(mo) rows.push({moule:mo, cycle:String(ma.cycle||'').trim(), couleurId:ma.couleur});
    });
    return rows;
  }

  orderedMachines.forEach(id=>{
    const c=config[id]||{}, m=day.machines[id]||{}, atelier=c.atelier;
    if(!parAtelier[atelier]) parAtelier[atelier]={machines:0,ouvriers:new Set(),rows:[]};
    const a=parAtelier[atelier];
    const operateur=String(m.operateur||'').trim();
    const mouldRows=getMouldRows(m);
    if(m.statut !== 'arret_total'){ a.machines+=1; totalMachinesActives+=1; }
    if(operateur){ a.ouvriers.add(operateur); ouvriersJour.add(operateur); }
    a.rows.push({id,c,m,mouldRows});
  });

  let html=`<div class="resume-buttons">
    <button type="button" class="btn-primary" onclick="showResumePart('resumeMoules')">📋 Moules + couleurs</button>
    <button type="button" class="btn-secondary" onclick="showResumePart('resumeAteliers')">🏭 Ateliers : machines + ouvriers</button>
  </div>
  <div id="resumeMoules" class="resume-part">
    <div class="card"><h2>Tournée 1 — Moules par machine</h2>`;

  Object.keys(parAtelier).sort((a,b)=>Number(a)-Number(b)).forEach(at=>{
    html+=`<h3 style="margin:16px 0 6px">Atelier ${esc(at)}</h3>`;
    parAtelier[at].rows.forEach(r=>{
      const noMoule=r.mouldRows.length===0;
      const cycleMissing=!noMoule && r.mouldRows.some(x=>!x.cycle);
      const dot=noMoule
        ? '<span title="Aucun moule" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;margin-right:5px;vertical-align:middle"></span>'
        : (cycleMissing ? '<span title="Cycle manquant" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#f59e0b;margin-right:5px;vertical-align:middle"></span>' : '');
      const moulds=noMoule
        ? '<span style="color:#777">Aucun moule</span>'
        : r.mouldRows.map(x=>{
            const col=refs.couleurs.find(c=>c.id===(x.couleurId||r.m.couleur||r.c.couleur));
            return `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px;padding:3px 8px;border:1px solid #ddd;border-radius:8px"><b>${esc(x.moule.numero)}</b><span>${esc(col?col.nom:'—')}</span></span>`;
          }).join('');
      html+=`<div class="resume-machine-line" style="display:flex;align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid #eee;flex-wrap:wrap">
        <span style="min-width:88px;font-weight:700;white-space:nowrap">${dot}${esc(String(r.c.num||r.id))}</span>
        <span style="display:flex;align-items:center;flex-wrap:wrap">${moulds}</span>
      </div>`;
    });
  });
  html+=`</div></div>
  <div id="resumeAteliers" class="resume-part" style="display:none;">
    <div class="card"><h2>Tournée 1 — Ateliers</h2>`;
  Object.keys(parAtelier).sort((a,b)=>Number(a)-Number(b)).forEach(at=>{
    const a=parAtelier[at];
    html+=`<div class="atelier-summary"><h3>Atelier ${esc(at)}</h3><div>Machines en fonctionnement : <b>${a.machines}</b></div><div>Ouvriers : <b>${a.ouvriers.size}</b></div></div>`;
  });
  html+=`<div class="atelier-summary total"><h3>Total</h3><div>Machines en fonctionnement : <b>${totalMachinesActives}</b></div><div>Ouvriers uniques : <b>${ouvriersJour.size}</b></div></div></div></div>`;
  content.innerHTML=html;
}

    const c=config[id],m=day.machines[id],moule=refs.moules.find(x=>x.id===m.mouleId),couleur=refs.couleurs.find(x=>x.id===(m.couleur||c.couleur));
    const moulesAvancesStr=(m.moulesAvances||[]).filter(ma=>ma.mouleId).map(ma=>{const mo=refs.moules.find(x=>x.id===ma.mouleId);return mo?`${mo.numero} (${ma.pieces||0}p)`:'';}).filter(x=>x).join('; ');
    return {Date:formatDateShort(day.date),Shift:day.shift,Atelier:c.atelier,Machine:c.num,Moule:moule?moule.numero:'',MouleNom:moule?moule.nom:'',PiecesTheoriques:moule?moule.piecesParMoule:'',PiecesReelles:moule?moule.piecesReelles:'',MoulesAvances:moulesAvancesStr,CouleurMoule:couleur?couleur.nom:'',ProductionMoule2:(m.moulesAvances||[]).map(x=>x.production||'').join('; '),SacsMoule2:(m.moulesAvances||[]).map(x=>x.sacs||'').join('; '),BroyeMoule2:(m.moulesAvances||[]).map(x=>x.broye||'').join('; '),RebutsMoule2:(m.moulesAvances||[]).map(x=>x.rebuts||'').join('; '),TempsArretMoule2:(m.moulesAvances||[]).map(x=>x.arret||'').join('; '),TypeArretMoule2:(m.moulesAvances||[]).map(x=>x.cause||'').join('; '),Operateur:m.operateur,Cycle:m.cycle,Matiere:m.matiere,Production:m.production,SacsMatiere:m.sacs,MatiereBroyee:m.broye||'',Rebuts:m.rebuts,Etat:m.statut==='arret_total'?'Arrêt total':'Marche',TempsArret:(m.arrets||[]).reduce((s,a)=>s+(parseFloat(a.duree)||0),0),CausesArret:(m.arrets||[]).filter(a=>a.cause).map(a=>a.cause+(a.duree?` (${a.duree}min)`:'')).join('; ')};
  });
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Tournee');
  XLSX.writeFile(wb,'tournee_'+day.date+'.xlsx');
}

renderHome();
